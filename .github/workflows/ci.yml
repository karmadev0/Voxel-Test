name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      - name: Instalar dependencias de sistema (X11, Mesa/OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libegl1-mesa-dev \
            pkg-config

      - name: cargo check
        run: cargo check --release

      - name: cargo build
        run: cargo build --release

      - name: Subir binario compilado
        uses: actions/upload-artifact@v4
        with:
          name: voxel-engine-linux-x86_64
          path: target/release/voxel-engine
