[package]
name = "voxel-engine"
version = "0.1.0"
edition = "2021"
description = "Motor voxel propio (Fase 1: mundo navegable con greedy meshing)"

[dependencies]
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.25"
noise = "0.9"
rayon = "1.10"
env_logger = "0.11"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
