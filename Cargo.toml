[package]
name = "voxel-engine"
version = "0.1.0"
edition = "2021"
description = "Motor voxel propio (Fase 4: streaming de chunks + build Android)"

# La lib es lo que compila cargo-apk para Android (necesita cdylib) y
# también lo que usa el binario de escritorio (rlib), para no duplicar
# ningún código entre las dos plataformas.
[lib]
name = "voxel_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "voxel-engine"
path = "src/main.rs"

[dependencies]
wgpu = "0.19"
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.25"
noise = "0.9"
rayon = "1.10"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# Solo se compilan/descargan cuando el target es Android: el glue de
# NativeActivity (vía el feature de winit) y un logger que manda los
# `log::info!`/`log::warn!` existentes a logcat en vez de a un stdout
# que ahí no existe.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.13"
# winit 0.30 trae android-activity 0.6.x, con más rodaje en ROMs de
# fabricante (Honor/Huawei) que la 0.5.x vieja que traía winit 0.29.
android-activity = "0.6"

# Leído por `cargo apk build` (crate cargo-apk, ver el workflow de CI) para
# generar el AndroidManifest.xml, firmar con la clave de debug y empaquetar
# el .so resultante en un APK instalable. No afecta al build de escritorio.
[package.metadata.android]
package = "com.voxelengine.fase4"
apk_label = "Voxel Engine"
target_sdk_version = 33
min_sdk_version = 26
# Vulkan es obligatorio: la Fase 4 no tiene fallback a GLES en Android.
[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.version"
required = true
version = 0x400000 # Vulkan 1.0

[package.metadata.android.application]
label = "Voxel Engine"

# panic = "abort" no linkea bien en el cdylib de Android (el runtime de
# NDK espera poder desenrollar el stack); "unwind" funciona en ambas
# plataformas con un costo de rendimiento despreciable para este engine.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 1
